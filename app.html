const okDom=(e,d)=>e.endsWith('@'+d)||e.endsWith('.'+d);
const distM=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
function notifyAdmin(t,verbose){

/* ---------- геолокация: автоматты рұқсат, Haversine, 20 м радиус ---------- */
let userPos=null,geoSt='idle',geoWid=null,pickPt=null,pmap=null,pMk=null,pCirc=null,uMk=null,meMk=null;
const needGeo=()=>GEO_REQUIRED&&!!me&&me.role!=='dev';
const pickDist=()=>(userPos&&pickPt)?distM(userPos.lat,userPos.lng,pickPt.lat,pickPt.lng):null;
function geoOkNow(){if(!needGeo())return true;const d=pickDist();return d!==null&&d<=GEO_RADIUS}
function geoUI(){
 const s=$('#geo-s'),b=$('#sub-b'),r=$('#geo-b'),form=!!b;
 const C={ok:'bg-emerald-50 text-emerald-700 border-emerald-200',warn:'bg-amber-50 text-amber-700 border-amber-200',bad:'bg-red-50 text-red-700 border-red-200',info:'bg-sky-50 text-sky-700 border-sky-200'};
 let t,c;
 if(!needGeo()){t='🧑‍💻 Әзірлеуші: геолокация тексерілмейді';c='info'}
 else if(geoSt==='unsupported'){t='⚠️ Браузер геолокацияны қолдамайды'+(form?'. Өтінім жіберу бұғатталды':'');c='bad'}
 else if(geoSt==='denied'){t='🚫 Геолокацияға рұқсат берілмеген (браузер баптауын және HTTPS-ті тексеріңіз)'+(form?'. Өтінім жіберу бұғатталды':'');c='bad'}
 else if(!userPos){t=geoSt==='nofix'?'📡 GPS сигналы жоқ, күте тұрыңыз…':'⏳ Геолокацияға рұқсат сұралуда…';c='warn'}
 else if(!form){t='📍 Орныңыз анықталды (±'+Math.round(userPos.acc)+' м)';c='ok'}
 else{const d=Math.round(pickDist());
  if(d<=GEO_RADIUS){t='✅ Нүкте сізден '+d+' м (≤ '+GEO_RADIUS+' м). Жіберуге болады • GPS ±'+Math.round(userPos.acc)+' м';c='ok'}
  else{t='❌ Нүкте сізден '+d+' м алыс (рұқсат '+GEO_RADIUS+' м). Жіберу өшірілді';c='bad'}}
 if(s){s.className=(form?'inline-block ':'')+'text-xs font-bold px-3 py-1.5 rounded-full border '+C[c];s.textContent=t}
 if(b)b.disabled=!geoOkNow();
 if(r)r.classList.toggle('hidden',!(needGeo()&&['denied','nofix','unsupported'].includes(geoSt)));
}
function startGeo(force){
 if(!needGeo())return;
 if(!navigator.geolocation){geoSt='unsupported';geoUI();return}
 if(geoWid!==null){if(!force)return;navigator.geolocation.clearWatch(geoWid);geoWid=null}
 geoSt='wait';geoUI();
 geoWid=navigator.geolocation.watchPosition(p=>{
  userPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};geoSt='ok';
  if(!pickPt)pickPt={lat:userPos.lat,lng:userPos.lng};
  syncPick();showMe();geoUI();
 },e=>{
  if(e.code===1){geoSt='denied';userPos=null;if(geoWid!==null)navigator.geolocation.clearWatch(geoWid);geoWid=null}
  else if(!userPos)geoSt='nofix';
  geoUI();
 },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}
function syncPick(){
 if(!pmap)return;

 if(pickPt){if(pMk)pMk.setLatLng(ll(pickPt)).setStyle({color:col,fillColor:col});else pMk=L.circleMarker(ll(pickPt),{radius:9,color:col,fillColor:col,fillOpacity:.9,weight:3}).addTo(pmap)}

  if(uMk)uMk.setLatLng(ll(userPos));else uMk=L.circleMarker(ll(userPos),{radius:6,color:'#fff',weight:2,fillColor:'#2563eb',fillOpacity:1}).bindPopup('📍 Сіз осындасыз').addTo(pmap);
  if(pCirc)pCirc.setLatLng(ll(userPos));else pCirc=L.circle(ll(userPos),{radius:GEO_RADIUS,color:'#2563eb',weight:2,fillOpacity:.08}).addTo(pmap);
  if(!pmap._fit){pmap.setView(ll(userPos),19);pmap._fit=1}
 }
}
function initPick(){
 const el=$('#pmap');if(!el)return;
 if(!pickPt&&userPos)pickPt={lat:userPos.lat,lng:userPos.lng};
 if(typeof L==='undefined'){el.innerHTML='<div class="h-full flex items-center justify-center text-xs text-slate-500 p-4 text-center">Карта жүктелмеді. Нүкте GPS орныңыз бойынша автоматты алынады.</div>';return}
 const c=userPos?[userPos.lat,userPos.lng]:(DORMS[(me.role==='dev'&&UNI)?UNI:me.dorm].p||ALM);
 pmap=L.map(el,{center:c,zoom:userPos?19:17,maxZoom:19});
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(pmap);
 if(userPos)pmap._fit=1;
 pmap.on('click',e=>{
  if(needGeo()&&!userPos)return toast('Алдымен геолокацияға рұқсат беріңіз','err');
  pickPt={lat:e.latlng.lat,lng:e.latlng.lng};syncPick();geoUI();
  const d=pickDist();if(d!==null&&d>GEO_RADIUS)toast('⚠️ Нүкте сізден '+Math.round(d)+' м алыс. Рұқсат етілген радиус — '+GEO_RADIUS+' м','err');
 });
 syncPick();geoUI();setTimeout(()=>pmap&&pmap.invalidateSize(),250);
}
function showMe(){

 const ll=[userPos.lat,userPos.lng];
 try{
  if(map.addLayer){if(meMk)meMk.setLatLng(ll);else meMk=L.circleMarker(ll,{radius:7,color:'#fff',weight:2,fillColor:'#2563eb',fillOpacity:1}).bindPopup('📍 Сіз осындасыз').addTo(map)}

 }catch(e){}
}

async function nsReq(path,body){
 try{const t=localStorage.getItem('cc_token');
  const r=await fetch(API+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})},body:body?JSON.stringify(body):undefined});
  return await r.json();
 }catch(e){return{ok:false,error:'Серверге қосылу мүмкін болмады. Интернетті тексеріңіз'}}
}

async function initNotif(){
 const u=nsUni(),q=me.role==='dev'?'?uni='+encodeURIComponent(u):'';
 const r=await nsReq('/api/admin/settings'+q);
 if(r.ok){const a=$('#ns-tg'),b=$('#ns-em');if(a)a.value=r.settings.telegram_chat_id||'';if(b)b.value=r.settings.email||''}
 else toast(r.error||'Қате шықты','err');
 const val=()=>({uni:u,telegram_chat_id:$('#ns-tg').value.trim(),email:$('#ns-em').value.trim()});
 const save=async()=>{const v=val();if(v.telegram_chat_id&&!/^\d+$/.test(v.telegram_chat_id)){toast('Telegram ID тек сандардан тұруы керек','err');return false}
  const x=await nsReq('/api/admin/settings',v);if(!x.ok){toast(x.error||'Қате шықты','err');return false}return true};
 $('#ns-save').onclick=async()=>{if(await save())toast('Баптаулар сақталды')};
 $('#ns-test').onclick=async()=>{
  if(!await save())return;
  const x=await nsReq('/api/admin/test-notification',{uni:u});
  if(x.ok)toast('Тест хабарлама жіберілді: Telegram '+(x.tg?'✅':'❌')+' · Email '+(x.mail?'✅':'❌'));
  else toast(x.error||'Қате шықты','err');
 };
}

  const d=DORMS[t.dorm],i=n[t.dorm]=(n[t.dorm]||0)+1,c={open:['r','!'],received:['o','📥'],in_progress:['a','🛠'],resolved:['g','✓']}[t.st]||['a','🛠'];

function drawLeaflet(el,it){
 if(typeof L==='undefined'){el.innerHTML='<div class="h-full flex items-center justify-center p-6 text-center text-sm text-slate-500">Карта жүктелмеді. Интернетті тексеріп, бетті жаңартыңыз.</div>';return}
 map=L.map(el,{center:[43.2389,76.925],zoom:12});
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(map);
 layer=L.layerGroup().addTo(map);
 it.forEach(x=>(x.camp?L.circleMarker(x.p,{radius:8,color:'#1d4ed8',weight:3,fillColor:'#fff',fillOpacity:1}):L.marker(x.p,{icon:L.divIcon({className:'',html:x.h,iconSize:[30,30],iconAnchor:[15,15]})})).bindPopup(x.pop).addTo(layer));
 map.fitBounds(it.map(x=>x.p),{padding:[40,40],maxZoom:16});
 setTimeout(()=>map&&map.invalidateSize&&map.invalidateSize(),250);showMe();
}

async function initYMap(el,it){
 el.innerHTML='<div class="h-full flex items-center justify-center text-sm text-slate-400">Карта жүктелуде…</div>';
 await loadYM();
 if(!el.isConnected)return;
 el.innerHTML='';
 const m=new ymaps.Map(el,{center:[43.2389,76.925],zoom:12,controls:['zoomControl','geolocationControl']},{suppressMapOpenBlock:true});
 map=m;
 it.forEach(x=>m.geoObjects.add(new ymaps.Placemark(x.p,{balloonContent:x.pop},{preset:x.y})));
 m.setBounds(m.geoObjects.getBounds(),{checkZoomRange:true,zoomMargin:50}).then(()=>{if(m.getZoom()>16)m.setZoom(16)});showMe();
}
function initMap(){

}

async function askAI(q,el){
 if(!AI_URL)return 'ЖИ әлі қосылмаған: файлдың басындағы AI_URL жолына серверіңіздің (Worker) адресін жазыңыз.';
 const c=new AbortController(),t=setTimeout(()=>c.abort(),45000);
 try{
  const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,context:aiCtx(),lang:localStorage.getItem('cc_lang')||'kk'}),signal:c.signal});
  if((r.headers.get('content-type')||'').includes('application/json')){const d=await r.json().catch(()=>({}));return d.reply||'⚠️ Сервер бос жауап қайтарды (HTTP '+r.status+').'}
  if(!r.ok||!r.body)return '⚠️ Сервер күтпеген жауап қайтарды (HTTP '+r.status+').';
  const rd=r.body.getReader(),dec=new TextDecoder();let out='';
  for(;;){const {done,value}=await rd.read();if(done)break;out+=dec.decode(value,{stream:true});el.textContent=out;$('#ai-m').scrollTop=1e6}
  return out.trim()||'Жауап келмеді, қайта жазып көріңіз.';
 }catch(e){
  return e.name==='AbortError'?'⚠️ ЖИ 45 секунд жауап бермеді. Қайта жазып көріңіз.':'⚠️ Серверге қосылу қатесі ('+(e.message||e)+').';
 }finally{clearTimeout(t)}
}
$('#ai-b').onclick=()=>{$('#ai-p').classList.toggle('hidden');if(!$('#ai-m').children.length)aiAdd('Сәлем! Жатақхана, өтінім жіберу немесе төтенше жағдай туралы сұраңыз.')};
$('#ai-f').onsubmit=async e=>{e.preventDefault();const i=$('#ai-i'),q=i.value.trim();if(!q)return;i.value='';aiAdd(q,1);const w=aiAdd('ЖИ ойланып жатыр…');w.textContent=await askAI(q,w)};

(async()=>{
 if(localStorage.getItem('cc_token')){
  const r=await api('/auth/me');
  if(r.ok&&r.user&&DORMS[r.user.uni])me=fromServer(r.user);
  if(me&&me.role==='student'&&!FULL){location.replace(DASH);return}
  else if(r.status===401)localStorage.removeItem('cc_token');
 }
 if(me&&me.role==='admin')dflt=me.dorm;if(me)page=HOME[me.role];
 if(UNI&&!me){landing=false;preDorm=UNI;mode='login'}
 if(me)applyUni();
 if(me){setTimeout(loadT,400);loadInfo()}
 save();render();
})();
</script>
